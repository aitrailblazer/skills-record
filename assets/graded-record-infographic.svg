<text x="70" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#f2f2f2">DO NOT RUN: hyperframes-cli and hyperframes (HeyGen)</text>
<text x="70" y="576" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#9a9a9a">Their setup and update commands refresh and remove the agent's other installed skills by default.</text>
<text x="70" y="596" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#9a9a9a">The flag meant to skip that step is documented in their own files as temporarily ignored.</text>
